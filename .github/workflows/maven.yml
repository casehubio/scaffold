name: Build and Publish

on:
  repository_dispatch:
    types: [upstream-published]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true

      - name: Set up Java 21
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Published blocks-ui 0.3 requires this parent, absent from GitHub Packages.
      - name: Check out CaseHub parent 0.3
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        uses: actions/checkout@v4
        with:
          repository: casehubio/parent
          ref: a5766dfb227917c72ba681dc2971b780fd1fab00 # v0.3
          path: .ci/casehub-parent

      - name: Install CaseHub parent 0.3
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        run: mvn --batch-mode -N -f .ci/casehub-parent/pom.xml install

      - name: Build and test
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        run: mvn --batch-mode verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true)
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 5

      - name: Package scaffold backend
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        run: |
          cd scaffold-backend/target
          zip -qr "$GITHUB_WORKSPACE/scaffold-backend-0.3.zip" quarkus-app

      - name: Upload scaffold backend
        if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-backend-0.3
          path: scaffold-backend-0.3.zip
          if-no-files-found: error
