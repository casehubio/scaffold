<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">From Button Click to Running Containers</text>

  <!-- UI Layer -->
  <rect x="30" y="55" width="130" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="95" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Deploy Tab</text>
  <text x="95" y="96" text-anchor="middle" font-size="10" fill="#3b82f6">select + click</text>

  <!-- Arrow -->
  <line x1="160" y1="85" x2="195" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- REST -->
  <rect x="200" y="55" width="130" height="60" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="265" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Catalogue REST</text>
  <text x="265" y="96" text-anchor="middle" font-size="10" fill="#22c55e">POST /deploy</text>

  <!-- Arrow -->
  <line x1="330" y1="85" x2="365" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Case Engine -->
  <rect x="370" y="55" width="130" height="60" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="435" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Case Engine</text>
  <text x="435" y="96" text-anchor="middle" font-size="10" fill="#d97706">startCase()</text>

  <!-- Arrow -->
  <line x1="500" y1="85" x2="535" y2="85" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reconciliation Loop -->
  <rect x="540" y="45" width="230" height="80" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="655" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#9d174d">Reconciliation Loop</text>
  <text x="655" y="90" text-anchor="middle" font-size="10" fill="#ec4899">desired state vs actual state</text>
  <text x="655" y="106" text-anchor="middle" font-size="10" fill="#ec4899">converge continuously</text>

  <!-- Divider -->
  <line x1="30" y1="155" x2="770" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="400" y="172" text-anchor="middle" font-size="10" fill="#94a3b8">deployment target abstraction</text>

  <!-- Dev target -->
  <rect x="160" y="195" width="200" height="60" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Podman (dev)</text>
  <text x="260" y="236" text-anchor="middle" font-size="10" fill="#7c3aed">Unix domain socket + kqueue</text>

  <!-- Prod target -->
  <rect x="440" y="195" width="200" height="60" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="540" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Kubernetes (prod)</text>
  <text x="540" y="236" text-anchor="middle" font-size="10" fill="#0284c7">API server + kubectl</text>

  <!-- Arrows from reconciliation to targets -->
  <path d="M 620 125 L 620 145 Q 620 155 610 160 L 370 185 Q 360 190 360 195" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="4,3"/>
  <path d="M 690 125 L 690 145 Q 690 155 680 160 L 560 185 Q 555 190 555 195" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="4,3"/>

  <!-- Containers -->
  <rect x="100" y="280" width="90" height="40" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="145" y="304" text-anchor="middle" font-size="10" fill="#854d0e">manifest</text>
  <rect x="220" y="280" width="90" height="40" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="265" y="304" text-anchor="middle" font-size="10" fill="#854d0e">eidos</text>
  <rect x="340" y="280" width="90" height="40" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="385" y="304" text-anchor="middle" font-size="10" fill="#854d0e">engine</text>
  <rect x="460" y="280" width="90" height="40" rx="4" fill="#fef9c3" stroke="#fde047"/>
  <text x="505" y="304" text-anchor="middle" font-size="10" fill="#854d0e">my-llm</text>

  <!-- Arrow from Podman to containers -->
  <line x1="260" y1="255" x2="260" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Label -->
  <text x="610" y="310" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">4 containers provisioned in dependency order</text>
</svg>
