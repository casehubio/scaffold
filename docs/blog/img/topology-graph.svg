<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="dep-arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="260" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">01-hello-llm Topology Graph</text>

  <!-- Layer labels -->
  <text x="35" y="75" font-size="10" fill="#94a3b8" font-weight="500">Layer 1</text>
  <text x="35" y="135" font-size="10" fill="#94a3b8" font-weight="500">Layer 2</text>
  <text x="35" y="195" font-size="10" fill="#94a3b8" font-weight="500">Layer 3</text>
  <text x="35" y="240" font-size="10" fill="#94a3b8" font-weight="500">Layer 4</text>

  <!-- manifest node -->
  <rect x="230" y="50" width="140" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">manifest</text>
  <text x="300" y="84" text-anchor="middle" font-size="9" fill="#059669">casehub_application</text>

  <!-- eidos node -->
  <rect x="230" y="112" width="140" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="300" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">eidos</text>
  <text x="300" y="146" text-anchor="middle" font-size="9" fill="#3b82f6">casehub_application</text>

  <!-- engine node -->
  <rect x="230" y="174" width="140" height="44" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="300" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">engine</text>
  <text x="300" y="208" text-anchor="middle" font-size="9" fill="#d97706">casehub_application</text>

  <!-- my-llm node -->
  <rect x="230" y="222" width="140" height="30" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
  <text x="300" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">my-llm</text>

  <!-- Dependency arrows (bottom of source to top of target) -->
  <line x1="300" y1="94" x2="300" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <line x1="300" y1="156" x2="300" y2="172" stroke="#64748b" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <line x1="300" y1="218" x2="300" y2="220" stroke="#64748b" stroke-width="1.5" marker-end="url(#dep-arrow)"/>

  <!-- Legend -->
  <line x1="440" y1="75" x2="470" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="478" y="79" font-size="10" fill="#64748b">depends on</text>

  <text x="440" y="100" font-size="10" fill="#94a3b8">Provisioned bottom-up:</text>
  <text x="440" y="114" font-size="10" fill="#94a3b8">manifest first, my-llm last</text>
</svg>
