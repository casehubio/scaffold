app:
  name: ops
  description: "CaseHub operations management"
  version: "1.0"

  modules:
    required: [engine, desiredstate, work]
    optional: [ops-service, ops-deployment, ops-compliance]

  views:
    tabs:
      - id: fleet
        label: "Fleet"
        view: fleet-dashboard
      - id: deploy
        label: "Deploy"
        view: deployment-wizard
      - id: health
        label: "Health"
        view: health-monitor
      - id: drift
        label: "Drift"
        view: drift-detection
      - id: situations
        label: "Situations"
        view: situation-manager
      - id: topology
        label: "Topology"
        view: topology-graph
      - id: updates
        label: "Updates"
        view: update-manager

  datasets:
    applications:
      endpoint: /api/ops/applications
      source: ops-service
    deployments:
      endpoint: /api/ops/deployments
      source: ops-service
    clusters:
      endpoint: /api/ops/clusters
      source: ops-service
    reconciliation:
      endpoint: /api/ops/reconciliation
      source: ops-service
    cases:
      endpoint: /api/ops/cases
      source: ops-service
    topology:
      endpoint: /api/ops/topology
      source: topology-service
    approvals:
      endpoint: /api/ops/approvals
      source: ops-service

  connections:
    reconciliation-events:
      endpoint: /api/ops/reconciliation/events
      type: sse
      source: reconciliation-service
